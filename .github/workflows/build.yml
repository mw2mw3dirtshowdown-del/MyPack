name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Probe runner
        run: |
          {
            echo "java: $(java -version 2>&1 | head -1)"
            echo "gradle: $(gradle --version 2>/dev/null | grep -m1 '^Gradle' || echo none)"
            echo "line three"
          } > probe.txt
          MSG=$(python3 -c "import sys,urllib.parse; print(open('probe.txt').read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
          echo "::notice title=probe::${MSG}"
